    // Ensure window.fetch has both getter and setter across iframe environments
    // preventing "Cannot set property fetch of #<Window> which has only a getter"
    (function() {
      try {
        var _fetch = window.fetch;
        var patchTarget = function(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || (!desc.set && !desc.writable)) {
              Object.defineProperty(target, 'fetch', {
                get: function() { return _fetch; },
                set: function(fn) { _fetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        };
        patchTarget(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          patchTarget(Window.prototype);
        }
        if (typeof globalThis !== 'undefined' && globalThis !== window) {
          patchTarget(globalThis);
        }
      } catch (_) {}
    })();
